grp_leg.add("Leg_tolerance", double_t, 0, "Leg marker accuracy tolerance (m)", 0.1, 0.000, 1.0)

# New parameters for dock offsets and max distance
grp_common.add("dock_offset_x", double_t, 0, "Dock X offset (m)", 0.05, -2.0, 2.0)
grp_common.add("dock_offset_y", double_t, 0, "Dock Y offset (m)", 0.05, -2.0, 2.0)
grp_common.add("dock_offset_yaw", double_t, 0, "Dock Yaw offset (radians)", 0.139626, -3.14159, 3.14159)
grp_common.add("max_dock_distance", double_t, 0, "Maximum dock distance (m)", 0.5, 0.0, 5.0)

exit(gen.generate(PACKAGE, "docking", "DetectionNode"))